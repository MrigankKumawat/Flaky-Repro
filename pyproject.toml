[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-repro"
version = "0.1.1"
description = "An empirical, frequency-based flaky test diagnosis and reproduction tool."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Flaky-Repro Developers"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest>=7.0.0",
]

[project.scripts]
flaky-repro = "flaky_repro.pipeline:main"

[tool.setuptools]
packages = [
    "flaky_repro",
    "flaky_repro.examples",
    "flaky_repro.examples.functional_validation"
]

[tool.setuptools.package-data]
flaky_repro = ["examples/functional_validation/*.py"]
